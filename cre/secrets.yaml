# Maps the id the workflow asks for to the environment variable holding the
# value. `cre secrets create` reads this file, takes the value from the
# environment, and uploads it to the Vault DON — the value itself is never
# stored here.
#
# AERODATABOX_API_KEY is what `resolveApiKey` in settlement/main.ts requests,
# via config's `apiKeySecretId`, in namespace `main`.
secretsNames:
  AERODATABOX_API_KEY:
    - CRE_SECRET_AERODATABOX_KEY
